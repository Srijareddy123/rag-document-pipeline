[project]
name = "rag-document-pipeline"
version = "1.1.0"
description = "Document quality checks, chunking, embeddings and ChromaDB retrieval behind a FastAPI service."
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
